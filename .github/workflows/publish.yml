name: Publish ESP Lyric Speaker 0.4.11
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import verified public source
        if: hashFiles('esp-lyric-speaker-source.zip') != ''
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, zipfile, stat
          p=Path('esp-lyric-speaker-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'a3d11e9d79be42ca459d5cfbd81b470c436eecce63bbc3d1199fc97ae6c37cae'
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  n=i.filename
                  assert not n.startswith('/') and '..' not in n.split('/') and not n.startswith('.git/')
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('.')
          PYCODE
          rm esp-lyric-speaker-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish ESP Lyric Speaker 0.4.11 source, firmware and USB installer'
          git push
      - name: Verify release images
        run: python3 tools/verify_release.py
      - name: Native checks
        run: |
          python3 test/run.py
          python3 test/flash_test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
