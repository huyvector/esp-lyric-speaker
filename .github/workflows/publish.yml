name: Verify ESP Lyric Speaker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release images
        run: python3 tools/verify_release.py
      - name: Native checks
        run: |
          python3 test/run.py
          python3 test/flash_test.py
