[env:display]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L
; JPEGDEC declares this helper for its examples; firmware renders through its own SPI driver.
lib_ignore = bb_spi_lcd
lib_deps =
 olikraus/U8g2@2.36.5
 bblanchon/ArduinoJson@6.21.5
 bitbank2/JPEGDEC@1.8.2
 bitbank2/bb_spi_lcd@2.9.10
build_flags =
 -I../shared
 -D ARDUINO_USB_MODE=1
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D USER_SETUP_LOADED=1
 -D GC9A01_DRIVER=1
 -D TFT_WIDTH=240
 -D TFT_HEIGHT=240
 -D TFT_MOSI=1
 -D TFT_SCLK=0
 -D TFT_CS=21
 -D TFT_DC=8
 -D TFT_RST=3
 -D TFT_MISO=-1
 -D LOAD_GLCD=1
 -D LOAD_FONT2=1
 -D LOAD_FONT4=1
 -D SPI_FREQUENCY=40000000
 -D CORE_DEBUG_LEVEL=0
 -D U8G2_16BIT
